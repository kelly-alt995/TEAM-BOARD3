<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Board</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#09090b;--surface:#131317;--raise:#1b1b21;--line:#26262d;--text:#f4f4f5;--muted:#9a9aa5;--or:#ff6a1f;--hi:#ff5d6c;--med:#ffb020;--low:#3ddc97;--glow:#ff6a1f33}
:root[data-theme="light"]{color-scheme:light;--bg:#f6f5f2;--surface:#fff;--raise:#f0eeea;--line:#e2dfd8;--text:#18181b;--muted:#6b6b74;--glow:#ff6a1f22}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden;
background-image:radial-gradient(700px 500px at 100% 30%,var(--glow),transparent 70%),radial-gradient(color-mix(in srgb,var(--text) 9%,transparent) 1px,transparent 1.2px);background-size:auto,24px 24px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.nav{display:flex;align-items:center;gap:14px;padding:16px 28px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em}.logo b{color:var(--or)}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:99px;font-size:13.5px;white-space:nowrap}
.tabs button:hover{color:var(--text)}.tabs button.on{color:var(--text);background:var(--raise)}
.nr{display:flex;gap:8px;align-items:center}
.icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface)}
.orange,.white,.ghost{border-radius:99px;padding:9px 18px;font-weight:600;font-size:13.5px;border:1px solid transparent;transition:transform .15s,box-shadow .15s}
.orange{background:var(--or);color:#fff}.orange:hover{box-shadow:0 6px 24px #ff6a1f66;transform:translateY(-1px)}
.white{background:#fff;color:#111}.white:hover{transform:translateY(-1px)}
.ghost{background:transparent;border-color:var(--line)}.ghost:hover{border-color:var(--muted)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;max-width:1120px;margin:0 auto;padding:34px 28px 20px}
.eyebrow{color:var(--or);font-size:11.5px;font-weight:700;letter-spacing:.14em;margin-bottom:12px}
h1{font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.035em;margin:0 0 16px;font-weight:800}
.hl{color:var(--or)}
.sub{color:var(--muted);max-width:460px;margin:0 0 22px}
.cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lnk{background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline}
.stats{display:flex;gap:34px;margin:30px 0 22px}
.stats b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.stats span{color:var(--muted);font-size:12px}
.team{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;transition:transform .15s,border-color .15s}
.pill:hover{transform:translateY(-2px);border-color:var(--or)}
.pill.on{background:var(--or);border-color:var(--or);color:#fff}
.pill em{font-style:normal;background:var(--raise);color:var(--muted);border-radius:99px;padding:0 7px;font-size:11px}
.pill.on em{background:#0003;color:#fff}
.pf{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none}
.face{width:100%;height:100%;object-fit:cover;display:block}
.spot{position:relative;aspect-ratio:1;max-width:430px;width:100%;margin-left:auto;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.spot>*{animation:fade .4s ease both}
.big,.big .face{width:100%;height:100%}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:6px;padding:6px;height:100%}
.tile{position:relative;border:0;padding:0;border-radius:18px;overflow:hidden;background:var(--raise);transition:transform .2s}
.tile:hover{transform:scale(1.04);z-index:2}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 6px;background:linear-gradient(transparent,#000b);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.tile.more{display:grid;place-content:center;text-align:center;cursor:default}.tile.more b{font-size:34px;color:var(--or)}.tile.more span{position:static;background:none;color:var(--muted)}
.badge{position:absolute;left:14px;bottom:14px;background:var(--or);color:#fff;font-weight:700;font-size:12px;padding:6px 14px;border-radius:99px;box-shadow:0 8px 24px #0006}
.info{position:absolute;right:14px;bottom:14px;text-align:right;color:#fff;text-shadow:0 2px 12px #000a}
.info h3{margin:0;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.info small{display:block;opacity:.85;margin-bottom:8px}
.info .ghost{color:#fff;border-color:#fff8;background:#0006;padding:5px 12px;font-size:12px;backdrop-filter:blur(6px)}
.sec{max-width:1120px;margin:0 auto;padding:10px 28px 0}
.fbar{min-height:30px;color:var(--muted);font-size:13px;margin-bottom:8px}.fbar b{color:var(--text);text-transform:uppercase;letter-spacing:.08em}
.fbar button{background:none;border:0;color:var(--or);font-weight:600}
.board{display:grid;grid-template-columns:repeat(3,minmax(270px,1fr));gap:16px;overflow-x:auto;padding:4px 2px 18px;align-items:start}
.col{background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line);border-radius:22px;padding:12px;min-height:220px;transition:border-color .2s,background .2s}
.col.over{border-color:var(--or);background:var(--glow)}
.col h2{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 6px 12px}
.col h2 i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.col h2 em{margin-left:auto;font-style:normal;background:var(--raise);border-radius:99px;padding:0 9px;color:var(--text)}
.col[data-col=todo]{--c:#ff4d5e}.col[data-col=doing]{--c:#ffc933}.col[data-col=done]{--c:#3ddc97}
.col{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 15%,var(--surface)),color-mix(in srgb,var(--c) 4%,var(--surface)));border-color:color-mix(in srgb,var(--c) 38%,var(--line));border-top:4px solid var(--c);box-shadow:0 -2px 28px color-mix(in srgb,var(--c) 20%,transparent)}
.col h2{color:color-mix(in srgb,var(--c) 75%,var(--text))}
.col h2 i{box-shadow:0 0 10px var(--c)}
.col h2 em{background:var(--c);color:#111;font-weight:800}
.col .card{border-left:3px solid var(--c)}
.col .card:hover{border-color:var(--c);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 30%,transparent)}
.col[data-col].over{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;cursor:grab;transition:transform .18s,border-color .18s,box-shadow .18s;animation:fade .3s ease both}
.card:hover{transform:translateY(-3px);border-color:var(--or);box-shadow:0 10px 30px var(--glow)}
.card.drag{opacity:.4}
.card .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.pr{display:flex;align-items:center;gap:6px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.pr i{width:7px;height:7px;border-radius:50%;background:currentColor}
.high{color:var(--hi)}.medium{color:var(--med)}.low{color:var(--low)}
.card b{display:block;font-weight:700;font-size:15px}
.col[data-col=done] .card b{color:var(--muted);text-decoration:line-through}
.desc{margin:4px 0 0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.foot .pf{width:22px;height:22px}.foot em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.od{color:var(--hi);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:13px}
.note{color:var(--muted);font-size:12px;text-align:center;padding:8px 0 24px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:20;backdrop-filter:blur(6px);animation:fade .2s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;width:min(460px,100%);max-height:90vh;overflow:auto;animation:pop .25s ease both}
.modal h3{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--or);outline-offset:1px}
select{text-transform:uppercase}
.row{display:flex;gap:10px}.row>div{flex:1}
.acts{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.del{color:var(--hi);margin-right:auto}
.conf{position:fixed;width:8px;height:12px;pointer-events:none;z-index:50;animation:fall 1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:28px}.spot{margin:0 auto}.nav{flex-wrap:wrap}.tabs{order:3;flex-basis:100%;justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:310px;max-width:calc(100vw - 32px);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px #0008;z-index:15;overflow:hidden;animation:fade .4s ease both}
.fh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:12px 14px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.fh em{font-style:normal;background:var(--or);color:#fff;border-radius:99px;padding:0 9px;font-size:11px;letter-spacing:0}
.fh i{margin-left:auto;font-style:normal;color:var(--muted);font-size:18px}
.fb{max-height:min(56vh,420px);overflow:auto;padding:0 12px 12px}
.fr{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;cursor:pointer;transition:background .15s}

.fi{flex:1;min-width:0}
.ft{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ft b{font-size:12px;letter-spacing:.1em;text-transform:uppercase}.ft span{font-size:11px;color:var(--muted);white-space:nowrap}
.fbar2{height:6px;background:var(--raise);border-radius:9px;margin:5px 0}
.fbar2 i{display:block;height:100%;background:var(--or);border-radius:9px;position:relative;min-width:4px}
.fbar2 u{position:absolute;left:0;top:0;bottom:0;background:var(--low);border-radius:9px}
.fd{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{grid-template-columns:1fr}
.mh{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.mp{width:96px;height:96px;border-radius:50%;overflow:hidden;border:3px solid var(--or);flex:none;animation:pop .5s .1s both cubic-bezier(.2,1.4,.4,1)}
.mh h3{text-transform:uppercase;letter-spacing:.1em;font-size:22px;margin:0}
.mh small{color:var(--muted);display:block;margin-bottom:8px}
.up{display:inline-block;margin:0;cursor:pointer;text-transform:none;letter-spacing:0;font-size:12px;padding:5px 12px;color:var(--text)}
.mg{margin:14px 0 6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:var(--c)}
.mg i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.mt{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--raise);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;padding:8px 12px;margin-bottom:6px;cursor:pointer;transition:transform .15s}
.mt:hover{transform:translateX(3px)}
.mt b{display:block;font-size:14px}.mt small{color:var(--muted);font-size:11.5px}
.fw{position:relative;padding:5px 0}
.fbar2{display:flex;margin:0;overflow:hidden}
.sg{height:100%;transition:width .5s}
.tip{position:absolute;left:0;bottom:calc(100% - 3px);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;z-index:3;background:#111;color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px;box-shadow:0 6px 18px #0008}
.tip.od{color:#ff8a95}
.fw:hover .tip{opacity:1;transform:none}
.sl{max-width:1120px;margin:0 auto;padding:14px 28px 6px}
.stories{display:flex;gap:6px;margin-bottom:6px}
.story{position:relative;flex:1;height:18px;background:none;border:0;padding:0;cursor:pointer}
.story::before{content:"";position:absolute;left:0;right:0;top:7px;height:4px;border-radius:9px;background:var(--line)}
.story i{position:absolute;left:0;top:7px;height:4px;border-radius:9px;background:var(--or);box-shadow:0 0 10px var(--or);transition:width .12s linear}
.story.done i{background:var(--muted);box-shadow:none}
.viewport{position:relative;overflow:hidden;border-radius:28px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.track{display:flex;transition:transform .75s cubic-bezier(.65,0,.2,1)}
.slide{flex:0 0 100%;display:flex;min-height:200px;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;cursor:pointer;opacity:.35;transform:scale(.96);transition:opacity .7s,transform .7s,border-color .2s}
.slide.act{opacity:1;transform:none}
.slide:hover{border-color:var(--or)}
.cover{flex:0 0 250px;position:relative;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));overflow:hidden}
.orb{position:absolute;border-radius:50%;background:#ffffff2e;animation:drift 9s ease-in-out infinite alternate}
.o1{width:210px;height:210px;right:-80px;top:-90px}.o2{width:130px;height:130px;left:-40px;bottom:-50px;animation-delay:-4s}
@keyframes drift{to{transform:translate(18px,14px) scale(1.12)}}
.ring{width:132px;height:132px;transform:rotate(-90deg);position:relative}
.rt{fill:none;stroke:#ffffff55;stroke-width:6}.rf{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .9s}
.pc{position:absolute;display:flex;flex-direction:column;align-items:center;color:#fff;line-height:1}
.pc strong{font-size:30px;font-weight:800;letter-spacing:-.03em}

.sb{padding:24px 30px;display:flex;flex-direction:column;justify-content:center;gap:10px;flex:1;min-width:0;background:radial-gradient(420px 220px at 100% 0,color-mix(in srgb,var(--a) 20%,transparent),transparent)}
.eb{color:var(--or);font-size:11px;font-weight:700;letter-spacing:.16em}
.sb h3{margin:0;font-size:32px;line-height:1.1;letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{display:flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600}
.chips i{width:7px;height:7px;border-radius:50%}
.sbar{height:8px;background:var(--raise);border-radius:9px;overflow:hidden;display:flex}
.sbar span{height:100%;transition:width .6s}
.sb em{font-style:normal;color:var(--or);font-weight:700;font-size:13px}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(8px);font-size:22px;line-height:1;opacity:0;transition:opacity .2s,transform .2s,border-color .2s}
.arr.l{left:14px}.arr.r{right:14px}
.viewport:hover .arr{opacity:1}.arr:hover{transform:translateY(-50%) scale(1.1);border-color:var(--or)}
@media (hover:none){.arr{display:none}}
.pi{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.pi h3{margin:0;font-size:22px}.pi small{color:var(--muted)}
.bigp{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:conic-gradient(#3ddc97 var(--p),var(--raise) 0);position:relative;flex:none}

.bigp span{position:relative}

.tabw{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.tabs{position:relative;justify-content:flex-start;scroll-behavior:smooth;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs>button:first-child{margin-left:auto}.tabs>button:last-child{margin-right:auto}

.pill.add:hover{color:var(--or)}

.ib:hover{transform:translateY(-2px);border-color:var(--or);color:var(--or)}
.ib.sm{width:28px;height:28px}.ib.big{width:46px;height:46px}
.ib.pri{background:var(--or);border-color:var(--or);color:#fff}.ib.pri:hover{color:#fff;box-shadow:0 6px 22px #ff6a1f66}

label.ib{margin:0;font-size:inherit;letter-spacing:0;text-transform:none;color:var(--text)}

.pg{display:inline-flex;align-items:center;gap:4px}

.mi{flex:1;min-width:0}.macts{display:flex;gap:6px;align-self:flex-start}

/* ---------- storage: shared db when available, else this browser only ---------- */
function lsLoad(){try{const d=JSON.parse(localStorage.getItem("teamboard2")||"null");if(d)S={projects:[],tasks:[],members:[],comments:[],...d}}catch(e){}}
function lsSave(){try{localStorage.setItem("teamboard2",JSON.stringify(S))}catch(e){}}
let sb=null,errMsg="";
const toRow=(col,o)=>col==="tasks"?{id:o.id,project:o.project,title:o.title,description:o.desc||"",assignee:o.assignee||"",due:o.due||"",priority:o.priority,status:o.status,created:o.created}:o;
const fromRow=(col,r)=>col==="tasks"?{...r,desc:r.description||""}:r;
function upsertLocal(col,obj){const a=S[col],i=a.findIndex(x=>x.id===obj.id);i<0?a.push(obj):a[i]=obj}
function fail(e){console.error(e);errMsg="Couldn’t reach the database: "+e.message;render()}
async function save(col,obj){
  upsertLocal(col,obj);
  if(sb){render();const{error}=await sb.from(col).upsert(toRow(col,obj));if(error)fail(error)}
  else{lsSave();render()}
}
async function remove(col,id){
  S[col]=S[col].filter(x=>x.id!==id);
  if(sb){render();const{error}=await sb.from(col).delete().eq("id",id);if(error)fail(error)}
  else{lsSave();render()}
}
async function loadAll(){
  for(const col of ["projects","tasks","members","comments"]){
    const{data,error}=await sb.from(col).select("*");
    if(error){fail(error);return}
    S[col]=data.map(r=>fromRow(col,r));
  }
  errMsg="";render();
}
let reloadT;const later=()=>{clearTimeout(reloadT);reloadT=setTimeout(loadAll,200)};

const prev={};

function syncTeam(){const gone=new Set(S.members.filter(m=>m.removed).map(m=>m.id));const extra=S.members.map(m=>m.id).filter(id=>id&&!BASE.includes(id)&&!gone.has(id)).sort((a,b)=>a.localeCompare(b));TEAM.length=0;TEAM.push(...BASE.filter(n=>!gone.has(n)),...extra)}

    if(lastCur!==cur){lastCur=cur;const b=t.querySelector(".on");if(b)t.scrollTo({left:b.offsetLeft-(t.clientWidth-b.offsetWidth)/2,behavior:"smooth"})}updTabArrows()}

  $("heroL").innerHTML=`<div class="eyebrow">● SPRINT IN PROGRESS</div>

    <div class="cta">${ib("goBoard","board","Jump to the board","pri big")}${ib("addT","clip","Add a task","big")}${proj?ib("renProj","pencil","Rename project","big")+ib("delProj","trash",delArm===cur?"Click again to delete this project":"Delete project",delArm===cur?"big del armed":"big del"):""}</div>
    <div class="stats"><div><b data-k="t" data-n="${all.length}">${all.length}</b><span>Tasks</span></div><div><b data-k="a" data-n="${n(all,"doing")}">0</b><span>In progress</span></div><div><b data-k="d" data-n="${n(all,"done")}">0</b><span>Done</span></div></div>

  if(!sel)$("spot").innerHTML=`<div class="mosaic">${TEAM.map(m=>`<button class="tile" data-m="${m}">${face(m)}<span>${m}</span></button>`).join("")}<div class="tile more"><b>${TEAM.length}</b><span>teammates</span></div></div><div class="badge">Tap a face</div>`;

  $("note").textContent=errMsg||(db?"Live-synced with your team.":"Saved in this browser only. Add your Supabase details to sync with your team.");

let fopen=innerWidth>900;
const fmt=d=>new Date(d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
function renderFloat(){
  const today=new Date().toISOString().slice(0,10);
  const rows=TEAM.map(m=>{const mine=S.tasks.filter(t=>t.assignee===m),open=mine.filter(t=>t.status!=="done"),next=open.filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due))[0];
    return {m,open:open.length,done:mine.length-open.length,total:mine.length,od:!!next&&next.due<today,c:{todo:mine.filter(t=>t.status==="todo").length,doing:mine.filter(t=>t.status==="doing").length,done:mine.length-open.length},tip:next?`${next.due<today?"Overdue":"Next due"} ${fmt(next.due)} · ${next.title}`:(open.length?"No due date set":"All clear")}});

const GR=[["#ff6a1f","#ff3d6e"],["#7c5cff","#4cc9f0"],["#2dd4bf","#3b82f6"],["#ffb020","#ff4d5e"],["#3ddc97","#0ea5e9"]];

/* slider: state-driven (index + timer live in variables, never in the DOM) */
const COARSE=matchMedia("(pointer:coarse)").matches;
const SLIDE_MS=6500;let si=0,elapsed=0,hold=false,px=null,moved=false;
function renderSlider(){
  const ps=[...S.projects].sort((a,b)=>(a.created||0)-(b.created||0)),el=$("slider"),n=ps.length;

sl.addEventListener("pointermove",e=>{if(px!==null&&Math.abs(e.clientX-px)>8)moved=true});
sl.addEventListener("pointerup",e=>{if(px===null)return;const dx=e.clientX-px;px=null;if(Math.abs(dx)>50)setSlide(si+(dx<0?1:-1))});
sl.addEventListener("pointercancel",()=>{px=null});
sl.addEventListener("click",e=>{
  if(e.target.closest("#sp")){setSlide(si-1);return}
  if(e.target.closest("#sn")){setSlide(si+1);return}
  const d=e.target.closest(".story");if(d){setSlide(+d.dataset.d);return}
  if(moved){moved=false;return}
  const s=e.target.closest(".slide");if(s){cur=s.dataset.sp;filter="";sel=null;render();projectInfo(cur)}
});
function projectInfo(id){
  const p=S.projects.find(x=>x.id===id);if(!p)return;const s=pstats(p),today=new Date().toISOString().slice(0,10),T=s.ts.length||1;
  const by=k=>s.ts.filter(t=>t.status===k).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
  const clr={todo:"#ff4d5e",doing:"#ffc933",done:"#3ddc97"};
  const row=t=>`<div class="mt" style="--c:${clr[t.status]}" data-tid="${esc(t.id)}"><div><b>${esc(t.title)}</b><small>${t.assignee?esc(t.assignee).toUpperCase():"Unassigned"}</small></div>${t.due?`<span class="${t.due<today&&t.status!=="done"?"od":""}" style="font-size:12px;white-space:nowrap">${fmt(t.due)}</span>`:""}</div>`;
  const grp=(label,k)=>{const l=by(k);return l.length?`<div class="mg" style="--c:${clr[k]}"><i></i>${label} · ${l.length}</div>${l.map(row).join("")}`:""};
  openModal(`<div class="pi"><div class="bigp" style="--p:${s.pct}%"><span>${s.pct}%</span></div><div><h3>${esc(p.name)}</h3><small>${s.d} done · ${s.left} left</small></div></div>
    <div class="sbar"><span style="width:${s.d/T*100}%;background:#3ddc97"></span><span style="width:${s.g/T*100}%;background:#ffc933"></span></div>`
    +(s.ts.length?grp("Still to do","todo")+grp("In progress","doing")+grp("Done","done"):`<div class="empty">No tasks in this project yet.</div>`)
    +`<div class="acts"><button class="ghost" id="x">Close</button><button class="orange" id="gb">Open board →</button></div>`,()=>{
    $("x").onclick=closeModal;
    $("gb").onclick=()=>{closeModal();$("boardsec").scrollIntoView({behavior:"smooth"})};
    $("modalHost").querySelector(".modal").style.width="min(520px,100%)";
    $("modalHost").querySelectorAll(".mt").forEach(r=>r.onclick=()=>{closeModal();taskModal(r.dataset.tid)});
  });
}
let lastCur=null;
function updTabArrows(){const t=$("tabs"),over=t.scrollWidth>t.clientWidth+2;
  for(const [id,off] of [["tabL",t.scrollLeft<=2],["tabR",t.scrollLeft+t.clientWidth>=t.scrollWidth-2]]){const b=$(id);b.disabled=off;b.style.visibility=over?"visible":"hidden"}}
$("tabL").onclick=()=>$("tabs").scrollBy({left:-Math.max(160,$("tabs").clientWidth*.7),behavior:"smooth"});
$("tabR").onclick=()=>$("tabs").scrollBy({left:Math.max(160,$("tabs").clientWidth*.7),behavior:"smooth"});
$("tabs").addEventListener("scroll",updTabArrows);
addEventListener("resize",updTabArrows);
function card(t){
  const od=t.due&&t.due<new Date().toISOString().slice(0,10)&&t.status!=="done";
  return `<div class="card" draggable="${COARSE?"false":"true"}" data-id="${esc(t.id)}"><div class="top"><span class="pr ${esc(t.priority)}"><i></i>${PRI[t.priority]||""}</span>${t.due?`<span class="${od?"od":""}">${od?"Overdue · ":""}${esc(t.due)}</span>`:""}</div>
    <b>${esc(t.title)}</b>${t.desc?`<p class="desc">${esc(t.desc)}</p>`:""}
    ${t.assignee?`<div class="foot"><span class="pf">${face(t.assignee)}</span><em>${esc(t.assignee)}</em></div>`:""}</div>`;
}

/* ---------- modals ---------- */
function openModal(html,onMount){
  $("modalHost").innerHTML=`<div class="ov"><div class="modal">${html}</div></div>`;
  $("modalHost").querySelector(".ov").addEventListener("mousedown",e=>{if(e.target.classList.contains("ov"))closeModal()});
  onMount&&onMount();const f=$("modalHost").querySelector("input,textarea");f&&f.focus();
}
const closeModal=()=>{$("modalHost").innerHTML=""};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function projectModal(){
  openModal(`<h3>New project</h3><label>Name</label><input id="pn" maxlength="60">
    <div class="acts"><button class="ghost" id="x">Cancel</button><button class="orange" id="ok">Create</button></div>`,()=>{
    $("x").onclick=closeModal;
    const go=async()=>{const v=$("pn").value.trim();if(!v)return;const p={id:uid(),name:v,created:Date.now()};cur=p.id;closeModal();await save("projects",p);if(db)render()};
    $("ok").onclick=go;$("pn").onkeydown=e=>{if(e.key==="Enter")go()};
  });
}
function taskModal(id){
  const t=S.tasks.find(x=>x.id===id)||{title:"",desc:"",assignee:sel||"",due:"",priority:"medium",status:"todo"};
  openModal(`<h3>${id?"Edit task":"New task"}</h3>
    <label>Title</label><input id="f-title" value="${esc(t.title)}" maxlength="120">
    <label>Description</label><textarea id="f-desc" rows="3">${esc(t.desc)}</textarea>
    <div class="row"><div><label>Assignee</label><select id="f-as"><option value="">Unassigned</option>${[...new Set([...TEAM,t.assignee].filter(Boolean))].map(m=>`<option ${m===t.assignee?"selected":""}>${esc(m)}</option>`).join("")}</select></div>
    <div><label>Due date</label><input id="f-due" type="date" value="${esc(t.due)}"></div></div>
    <div class="row"><div><label>Priority</label><select id="f-pr">${Object.entries(PRI).map(([k,v])=>`<option value="${k}" ${k===t.priority?"selected":""}>${v}</option>`).join("")}</select></div>
    <div><label>Status</label><select id="f-st">${COLS.map(([k,v])=>`<option value="${k}" ${k===t.status?"selected":""}>${v}</option>`).join("")}</select></div></div>
    <div class="acts">${id?ib("rm","trash","Delete this task","del"):""}<button class="ghost" id="x">Cancel</button><button class="orange" id="ok">Save</button></div>`,()=>{
    $("x").onclick=closeModal;
    if(id)$("rm").onclick=()=>{closeModal();remove("tasks",id)};
    $("ok").onclick=()=>{
      const title=$("f-title").value.trim();if(!title){$("f-title").focus();return}
      save("tasks",{id:id||uid(),project:t.project||cur,title,desc:$("f-desc").value.trim(),assignee:$("f-as").value,due:$("f-due").value,priority:$("f-pr").value,status:$("f-st").value,created:t.created||Date.now()});
      closeModal();
    };
  });
}
let rmArm=null;
async function removeMember(m){
  for(const t of S.tasks.filter(x=>x.assignee===m))await save("tasks",{...t,assignee:""});
  for(const c of S.comments.filter(x=>x.member===m))await remove("comments",c.id);
  const row=S.members.find(x=>x.id===m);
  await save("members",{id:m,photo:row?.photo||"",removed:true});
  if(sel===m)sel=null;if(filter===m)filter="";render();
}
function memberModal(m,tab="tasks"){
  const mine=S.tasks.filter(t=>t.assignee===m),today=new Date().toISOString().slice(0,10);
  const open=mine.filter(t=>t.status!=="done").length,pn=id=>S.projects.find(p=>p.id===id)?.name||"";
  const notes=S.comments.filter(c=>c.member===m).sort((a,b)=>b.created-a.created);
  const clr={todo:"#ff4d5e",doing:"#ffc933",done:"#3ddc97"};
  let author="";try{author=localStorage.getItem("tb_author")||""}catch(e){}
  const taskPane=mine.length?COLS.map(([k,label])=>{const it=mine.filter(t=>t.status===k).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
    return it.length?`<div class="mg" style="--c:${clr[k]}"><i></i>${label} · ${it.length}</div>`+it.map(t=>`<div class="mt" style="--c:${clr[k]}" data-tid="${esc(t.id)}"><div><b>${esc(t.title)}</b><small>${esc(pn(t.project))}</small></div>${t.due?`<span class="${t.due<today&&k!=="done"?"od":""}" style="font-size:12px;white-space:nowrap">${fmt(t.due)}</span>`:""}</div>`).join(""):""}).join(""):`<div class="empty">No tasks assigned yet.</div>`;
  const notePane=`<div class="nc"><textarea id="nt" rows="3" placeholder="Leave a note for ${esc(m)}: a new deadline, a change of plan…"></textarea><div class="nrow"><input id="na" placeholder="From (your name)" value="${esc(author)}" maxlength="30">${ib("ns","send","Post note (Ctrl + Enter)","pri")}</div></div>`
    +(notes.length?notes.map(c=>`<div class="note-i"><div class="nh"><b>${esc(c.author||"Someone")}</b><span>${new Date(c.created).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span>${ib("","trash","Delete note","sm del",`data-delnote="${esc(c.id)}"`)}</div><p>${esc(c.text)}</p></div>`).join(""):`<div class="empty">No notes yet. Leave one above.</div>`);
  openModal(`<div class="mh"><div class="mp">${face(m)}</div><div class="mi"><h3>${esc(m)}</h3><small>${open} open · ${mine.length-open} done</small></div>
    <div class="macts"><label class="ib" data-tip="Upload photo">${ic("camera")}<input type="file" id="ph" accept="image/*" hidden></label>${ib("addm","clip","Add a task for "+m)}${ib("rmm","trash","Remove "+m,"del")}${ib("x","x","Close")}</div></div>
    <div class="seg"><button data-tab="tasks" class="${tab==="tasks"?"on":""}">Tasks · ${mine.length}</button><button data-tab="notes" class="${tab==="notes"?"on":""}">Notes · ${notes.length}</button></div>
    <div id="p-tasks" ${tab==="tasks"?"":"hidden"}>${taskPane}</div><div id="p-notes" ${tab==="notes"?"":"hidden"}>${notePane}</div>`,()=>{
    const host=$("modalHost");
    $("x").onclick=closeModal;
    host.querySelector(".modal").style.width="min(560px,100%)";
    $("addm").onclick=()=>{sel=m;closeModal();cur?taskModal():projectModal()};
    const rm=$("rmm");
    rm.onclick=()=>{
      if(rmArm===m){rmArm=null;closeModal();removeMember(m);return}
      rmArm=m;rm.classList.add("armed");rm.dataset.tip="Click again to remove "+m+" (their tasks become unassigned)";showTip(rm);
      setTimeout(()=>{if(rmArm===m){rmArm=null;rm.classList.remove("armed");rm.dataset.tip="Remove "+m}},4000)};
    host.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{$("p-tasks").hidden=b.dataset.tab!=="tasks";$("p-notes").hidden=b.dataset.tab!=="notes";host.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b))});
    host.querySelectorAll(".mt").forEach(r=>r.onclick=()=>{closeModal();taskModal(r.dataset.tid)});
    const post=()=>{const text=$("nt").value.trim();if(!text){$("nt").focus();return}const a=$("na").value.trim();try{localStorage.setItem("tb_author",a)}catch(e){}
      save("comments",{id:uid(),member:m,author:a,text,created:Date.now()});closeModal();memberModal(m,"notes")};
    $("ns").onclick=post;$("nt").onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))post()};
    host.querySelectorAll("[data-delnote]").forEach(b=>b.onclick=()=>{remove("comments",b.dataset.delnote);closeModal();memberModal(m,"notes")});
    if(tab==="notes")$("nt").focus();
  });
}
function addMemberModal(){
  openModal(`<h3>Add team member</h3><label>Name</label><input id="mn" maxlength="30" placeholder="e.g. Sara"><div id="merr" style="color:var(--hi);font-size:13px;min-height:20px;margin-top:6px"></div>
    <div class="acts"><button class="ghost" id="x">Cancel</button><button class="orange" id="ok">Add member</button></div>`,()=>{
    $("x").onclick=closeModal;
    const go=async()=>{
      let v=$("mn").value.replace(/[<>"&'`\\]/g,"").trim().replace(/\s+/g," ");
      if(!v){$("merr").textContent="Please type a name.";$("mn").focus();return}
      v=v[0].toUpperCase()+v.slice(1);
      if(TEAM.some(n=>n.toLowerCase()===v.toLowerCase())){$("merr").textContent=v+" is already on the team.";return}
      closeModal();sel=v;
      const old=S.members.find(x=>x.id===v);await save("members",{id:v,photo:old?.photo||"",removed:false});
      memberModal(v);
    };
    $("ok").onclick=go;$("mn").onkeydown=e=>{if(e.key==="Enter")go()};
  });
}
function renameModal(){
  const p=S.projects.find(x=>x.id===cur);if(!p)return;
  openModal(`<h3>Rename project</h3><label>Name</label><input id="pn" maxlength="60" value="${esc(p.name)}"><div class="acts"><button class="ghost" id="x">Cancel</button><button class="orange" id="ok">Save</button></div>`,()=>{
    $("x").onclick=closeModal;$("pn").select();
    const go=()=>{const v=$("pn").value.trim();if(!v)return;closeModal();save("projects",{...p,name:v})};
    $("ok").onclick=go;$("pn").onkeydown=e=>{if(e.key==="Enter")go()};
  });
}
function burst(x,y){for(let i=0;i<26;i++){const s=document.createElement("i");s.className="conf";s.style.cssText=`left:${x}px;top:${y}px;background:hsl(${10+Math.random()*40} 100% ${50+Math.random()*20}%);--dx:${(Math.random()-.5)*300}px;--dy:${-80+Math.random()*260}px;--r:${Math.random()*720}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}

/* ---------- events ---------- */
$("newProj").onclick=projectModal;

$("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light";initIcons()};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-m],[data-note],[data-p],#goBoard,#addT,#addMem,#renProj,#delProj,#clr,#clr2,.card");if(!t)return;
  if(t.dataset.m){sel=filter=t.dataset.m;render();memberModal(sel);return}
  if(t.dataset.note){sel=t.dataset.note;render();memberModal(sel,"notes");return}
  if(t.dataset.p){cur=t.dataset.p;filter="";sel=null;delArm=null;render();return}
  if(t.id==="goBoard"){$("boardsec").scrollIntoView({behavior:"smooth"});return}
  if(t.id==="addT"){cur?taskModal():projectModal();return}
  if(t.id==="renProj"){renameModal();return}
  if(t.id==="addMem"){addMemberModal();return}
  if(t.id==="clr"||t.id==="clr2"){sel=null;filter="";render();return}
  if(t.id==="delProj"){
    if(delArm===cur){const id=cur;delArm=null;S.tasks.filter(x=>x.project===id).forEach(x=>remove("tasks",x.id));remove("projects",id)}
    else{delArm=cur;render();setTimeout(()=>{delArm=null;render()},3000)}
    return}
  if(t.classList.contains("card")&&!window.__nd)taskModal(t.dataset.id);
});
document.addEventListener("change",e=>{
  if(e.target.id!=="ph"||!sel)return;const f=e.target.files[0];if(!f)return;const who=sel,im=new Image();
  im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=256;const s=Math.min(im.width,im.height);
    c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);const photo=c.toDataURL("image/jpeg",.82),mm=S.members.find(x=>x.id===who);mm?mm.photo=photo:S.members.push({id:who,photo});save("members",{id:who,photo});render();if($("modalHost").firstChild){closeModal();memberModal(who)}};
  im.src=URL.createObjectURL(f);
});
const board=$("board");
board.addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(!c)return;dragId=c.dataset.id;c.classList.add("drag");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragId)});
board.addEventListener("dragend",()=>{dragId=null;render()});
board.addEventListener("dragover",e=>{const col=e.target.closest(".col");if(!col)return;e.preventDefault();board.querySelectorAll(".col").forEach(c=>c.classList.toggle("over",c===col))});
board.addEventListener("drop",e=>{
  const col=e.target.closest(".col");if(!col||!dragId)return;e.preventDefault();
  const t=S.tasks.find(x=>x.id===dragId);
  if(t&&t.status!==col.dataset.col){save("tasks",{...t,status:col.dataset.col});if(col.dataset.col==="done")burst(e.clientX,e.clientY)}
});
/* touch drag: press and hold a card, then move it to another column */
(function(){
  let tid=null,card=null,ghost=null,drag=false,sx=0,sy=0;
  const bd=$("board");
  const move=(x,y)=>{if(ghost){ghost.style.left=x-ghost.offsetWidth/2+"px";ghost.style.top=y-34+"px"}};
  const colAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest(".col")};
  bd.addEventListener("touchstart",e=>{
    const c=e.target.closest(".card");if(!c||e.touches.length!==1)return;
    card=c;const t=e.touches[0];sx=t.clientX;sy=t.clientY;drag=false;clearTimeout(tid);
    tid=setTimeout(()=>{drag=true;card.classList.add("drag");bd.style.scrollSnapType="none";
      ghost=card.cloneNode(true);ghost.className="card ghost";ghost.style.width=card.offsetWidth+"px";document.body.appendChild(ghost);
      move(sx,sy);if(navigator.vibrate)navigator.vibrate(15)},350);
  },{passive:true});
  bd.addEventListener("touchmove",e=>{
    const t=e.touches[0];
    if(!drag){if(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10)clearTimeout(tid);return}
    e.preventDefault();move(t.clientX,t.clientY);
    if(t.clientX<50)bd.scrollLeft-=14;else if(t.clientX>innerWidth-50)bd.scrollLeft+=14;
    const col=colAt(t.clientX,t.clientY);bd.querySelectorAll(".col").forEach(c=>c.classList.toggle("over",c===col));
  },{passive:false});
  const end=e=>{
    clearTimeout(tid);if(!drag){card=null;return}
    drag=false;window.__nd=true;setTimeout(()=>{window.__nd=false},500);bd.style.scrollSnapType="";
    const t=e.changedTouches[0],col=colAt(t.clientX,t.clientY),task=S.tasks.find(x=>x.id===card.dataset.id);
    if(ghost){ghost.remove();ghost=null}card=null;
    if(col&&task&&task.status!==col.dataset.col){save("tasks",{...task,status:col.dataset.col});if(col.dataset.col==="done")burst(t.clientX,t.clientY)}else render();
  };
  bd.addEventListener("touchend",end);bd.addEventListener("touchcancel",end);
})();
init();
